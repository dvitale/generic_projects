# SparringMate: FastAPI/Uvicorn on 127.0.0.1:8033 (systemd unit sparringmate.service, code in /opt/sparringmate).
limit_req_zone $binary_remote_addr zone=sparringmate_login:1m rate=10r/m;

server {
    listen 80;
    server_name sparringmate.u-s.it;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name sparringmate.u-s.it;
    ssl_certificate     /etc/ssl/certs/u-s.it.cer;
    ssl_certificate_key /etc/ssl/private/u-s.it.key;
    access_log /var/log/nginx/sparringmate-access.log;
    error_log  /var/log/nginx/sparringmate-error.log;

    # PGN import accepts up to 1 MB per request.
    client_max_body_size 2m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Stockfish questions and game commentary can take a while.
    proxy_read_timeout 180s;

    location = /api/auth/login {
        limit_req zone=sparringmate_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8033;
    }

    location / {
        proxy_pass http://127.0.0.1:8033;
    }
}
